<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Contact form</title>
</head>

<body>
    <!-- Static form schema for Netlify's deploy-time form detection. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="contact">
        <input name="bot-field">
        <input name="name">
        <input type="email" name="email">
        <textarea name="message"></textarea>
    </form>
    <p>Please use Contact us on the <a href="/">directory</a> to send a message.</p>
</body>

</html>
